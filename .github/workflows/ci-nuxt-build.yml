name: Nuxt Build

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-nuxt-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-nuxt-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
