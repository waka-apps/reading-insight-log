name: Micronaut Test

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/ci-micronaut-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Test
        run: ./gradlew test
