micronaut:
  server:
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - http://localhost:3001
            - http://127.0.0.1:3001
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowed-headers:
            - Content-Type
            - Authorization
            - Accept
            - Origin

app:
  dynamodb:
    table-name: ${DYNAMODB_TABLE:reading-insight-log-dev}
    endpoint: ${DYNAMODB_ENDPOINT:}
    region: ${AWS_REGION:ap-northeast-1}
    user-id: ${APP_USER_ID:default}
    daily-insight-limit: ${DAILY_INSIGHT_LIMIT:25}
